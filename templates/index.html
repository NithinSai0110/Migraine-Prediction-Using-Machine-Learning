<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Migraine Prediction</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
    }
    .card {
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      width: 500px;
      max-width: 90%;
      background-color: #fff;
      padding: 25px;
    }
    .btn-custom {
      background-color: #667eea;
      color: #fff;
      border-radius: 10px;
      font-weight: 500;
    }
    .btn-custom:hover {
      background-color: #5563de;
    }
    h3 {
      font-weight: 600;
      color: #333;
    }
    label {
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="card">
    <h3 class="text-center mb-3">🧠 Migraine Type Prediction</h3>
    <p class="text-center text-muted mb-4">Enter all details to predict migraine type</p>

    <form action="/predict" method="POST">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label>Age</label>
          <input type="number" name="Age" step="any" class="form-control" required>
        </div>
        <div class="col-md-6 mb-3">
          <label>Duration</label>
          <input type="number" name="Duration" step="any" class="form-control" required>
        </div>
      </div>

      <div class="mb-3">
        <label>Intensity</label>
        <input type="number" name="Intensity" step="any" class="form-control" required>
      </div>

      <p class="mt-3 mb-2"><strong>Enter 1 if Symptom is experienced, else 0</strong></p>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label>Nausea</label>
          <input type="number" min="0" max="1" name="Nausea" class="form-control" required>
        </div>
        <div class="col-md-6 mb-3">
          <label>Vomit</label>
          <input type="number" min="0" max="1" name="Vomit" class="form-control" required>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label>Phonophobia</label>
          <input type="number" min="0" max="1" name="Phonophobia" class="form-control" required>
        </div>
        <div class="col-md-6 mb-3">
          <label>Photophobia</label>
          <input type="number" min="0" max="1" name="Photophobia" class="form-control" required>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label>Visual</label>
          <input type="number" min="0" max="1" name="Visual" class="form-control" required>
        </div>
        <div class="col-md-6 mb-3">
          <label>Sensory</label>
          <input type="number" min="0" max="1" name="Sensory" class="form-control" required>
        </div>
      </div>

      <div class="mb-3">
        <label>Vertigo</label>
        <input type="number" min="0" max="1" name="Vertigo" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-custom w-100 mt-3">Predict</button>
    </form>
  </div>

</body>
</html>
